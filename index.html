<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Swipe through AI-made browser games." />
    <link rel="canonical" href="https://games.omgithub.com/" />
    <link rel="preconnect" href="https://pub-f8a67dd028134c809667b629ac5ff178.r2.dev" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Games Feed" />
    <meta property="og:url" content="https://games.omgithub.com/" />
    <meta property="og:title" content="AI Games Feed — Claude vs ChatGPT" />
    <meta property="og:description" content="Swipe through AI-made browser games." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI Games Feed — Claude vs ChatGPT" />
    <meta name="twitter:description" content="Swipe through AI-made browser games." />
    <title>AI Games Feed — Claude vs ChatGPT</title>
    <script>
      // Apply persisted fit mode before first paint so screenshots never flash cropped.
      try { if (localStorage.getItem('opus-feed-fit-mode-v2') !== 'cover') document.documentElement.classList.add('fit-letterbox'); } catch (_) { document.documentElement.classList.add('fit-letterbox'); }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
      <link rel="dns-prefetch" href="https://omgithub.com" />
</head>
  <body>
    <div class="loadbar" id="loadbar" role="progressbar" aria-label="Loading games"><i></i></div>
    <header class="topbar">
      <span class="logo">AI Games Feed</span>
      <div class="topbar-right">
        <div class="sort" id="sort" role="group" aria-label="Sort feed">
          <button type="button" class="sort-btn active" data-sort="top" aria-pressed="true">Top</button>
          <button type="button" class="sort-btn" data-sort="new" aria-pressed="false">New</button>
        </div>
        <button type="button" class="filter-btn" id="mobileFilter" aria-pressed="false" title="Show only mobile-tagged games">Mobile</button>
        <button type="button" class="filter-btn active tag-filter" id="tagFilter" hidden></button>
        <button type="button" class="filter-btn search-btn" id="searchBtn" aria-label="Search games" title="Search games">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button type="button" class="filter-btn search-btn liked-toggle" id="likedToggle" aria-pressed="false" aria-label="Show only games you liked" title="Show only games you liked">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path class="heart-outline" d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path class="heart-fill" d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="meta" id="count"></span>
      </div>
      <div class="search-box" id="searchBox" hidden>
        <input type="search" id="searchInput" placeholder="Search games, creators, tags" autocomplete="off" enterkeyhint="search" aria-label="Search games" />
        <button type="button" class="search-clear" id="searchClear" aria-label="Close search">✕</button>
      </div>
    </header>
    <main id="feed" class="feed" aria-label="Game feed"></main>
    <a class="create-game" id="createGame" href="https://omgithub.com/" target="_blank" rel="noopener" referrerpolicy="strict-origin-when-cross-origin" aria-label="Create a game" title="Create a game" aria-haspopup="dialog">
      <span class="create-game-plus" aria-hidden="true"></span>
    </a>
    <div class="hint hide" id="hint">Swipe down ↓</div>
    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    <div id="commentsSheet" class="comments-sheet comments-write-sheet" hidden aria-hidden="true">
      <div class="comments-backdrop" data-close-comments></div>
      <div class="comments-panel" role="dialog" aria-modal="true" aria-labelledby="commentsTitle">
        <div class="comments-grab" aria-hidden="true"><span class="comments-handle"></span></div>
        <header class="comments-header">
          <h2 id="commentsTitle" class="comments-title">Comments</h2>
          <button type="button" class="comments-close" aria-label="Close comments" data-close-comments>&times;</button>
        </header>
        <div class="comments-list" id="commentsList"></div>
        <form id="commentsComposer" class="comments-composer" hidden autocomplete="off">
          <div class="comments-compose-row">
            <textarea id="commentsInput" class="comments-input" maxlength="500" rows="2" placeholder="Write a comment…" aria-label="Write a comment" enterkeyhint="send"></textarea>
            <button type="submit" id="commentsSend" class="comments-send" disabled>Send</button>
          </div>
          <div class="comments-compose-meta"><span id="commentsError" class="comments-error" role="status" aria-live="polite"></span><span id="commentsCounter">0/500</span></div>
        </form>
        <div id="commentsSignin" class="comments-signin" hidden><a id="commentsSigninLink" class="comments-signin-btn" href="https://omgithub.com/auth/github" referrerpolicy="strict-origin-when-cross-origin">Sign in with GitHub</a></div>
      </div>
    </div>
    <div id="createSheet" class="comments-sheet create-sheet" hidden aria-hidden="true">
      <div class="comments-backdrop" data-close-create></div>
      <div class="comments-panel create-panel" role="dialog" aria-modal="true" aria-labelledby="createTitle">
        <div class="comments-grab" aria-hidden="true"><span class="comments-handle"></span></div>
        <header class="comments-header">
          <h2 id="createTitle" class="comments-title">What game should we build?</h2>
          <button type="button" class="comments-close" aria-label="Close" data-close-create>&times;</button>
        </header>
        <div class="create-body">
          <div class="fx-prompt-wrap"><textarea id="createPrompt" class="create-prompt" rows="4" maxlength="4000" placeholder="Describe a game to build…" aria-label="Describe a game to build" enterkeyhint="enter"></textarea></div>
          <div class="create-actions">
            <a id="createSend" class="create-send" href="https://omgithub.com/" target="_blank" rel="noopener" referrerpolicy="strict-origin-when-cross-origin" aria-disabled="true"><span class="create-send-label">Send ↗</span><span class="create-send-busy" aria-hidden="true">Launching…</span></a>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
